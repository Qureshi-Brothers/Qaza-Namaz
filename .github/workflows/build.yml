name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Android project banao
        run: flutter create --org com.qazatracker --project-name qaza_tracker --platforms android .
      - name: Android files patch karo
        run: python3 tools/patch_android.py
      - name: Packages
        run: flutter pub get
      - name: APK banao
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: qaza-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
